name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/preflight.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p sendline --all-targets --locked -- -D warnings
      - run: cargo test -p sendline --locked
      - run: cargo build -p sendline --locked
      - run: python3 tests/integration.py target/debug/sendline
      - run: python3 tests/editor_execution.py target/debug/sendline
      - run: cargo clippy -p sendline-extension --target wasm32-wasip2 --locked -- -D warnings
      - run: cargo build -p sendline-extension --target wasm32-wasip2 --locked

  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package.sh
      - run: python3 tests/installation.py

  registry-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build with Zed's registry packager
        env:
          ZED_EXTENSION_CLI_SHA: 9ee3c503a4bbbc6b4a0f8a789acca4871d773223
        run: |
          curl --fail --location --silent --show-error "https://zed-extension-cli.nyc3.digitaloceanspaces.com/$ZED_EXTENSION_CLI_SHA/x86_64-unknown-linux-gnu/zed-extension" -o /tmp/zed-extension
          chmod +x /tmp/zed-extension
          /tmp/zed-extension --scratch-dir .build/registry --source-dir . --output-dir dist/registry
      - run: curl --fail --location --silent --show-error https://api.zed.dev/extensions/http/0.0.1/download -o .build/http-language.tar.gz
      - run: python3 tests/registry_package.py dist/registry --language-provider .build/http-language.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: registry-package
          path: dist/registry/
          if-no-files-found: error
