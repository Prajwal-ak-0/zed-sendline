[package]
name = "sendline"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Sendline request runner and language server for Zed"
repository = "https://github.com/Prajwal-ak-0/zed-sendline"

[[bin]]
name = "sendline"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = "0.4.44"
reqwest = "0.13.2"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3"
tokio = { version = "1.50.0", features = ["full"] }
tower-lsp = "0.20.0"
uuid = { version = "1.22.0", features = ["v4"] }
